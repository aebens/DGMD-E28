<!DOCTYPE html>

    <head>
        <title>Tic Tac Toe</title>

        <style>

            body {
                margin: 50px 50px;
                padding: 1 rem;
                background: #FAFAF8;
                color: #1A1917;
            }

            h1 {
                color: #B45309;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                border-bottom: 1px solid #C9C6BD;
            }

            a {
                color: #B45309;
            }

            .board {
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 5px;
                max-width: 310px;
                margin: 0 auto 30px;
                justify-items: center;
            }

            .square {
                width: 100px;
                height: 100px;
                border: 1px solid #a19e95;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 48px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                color: #5C5A53;
            }

            .square:hover {
                background-color: #f5b27eda;
            }

            .status {
                margin: 0 auto 20px;
                display: flex;
                width: 300px;
                padding: 10px;
                font-size: 18px;
                border: 1px solid #a19e95;
                justify-content: center;
                font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                font-size: 24px;
            }

            button {
                display: flex;
                margin: 0 auto;
            }
        </style>

        <script>
            window.onload = function(){
                document.querySelector("button").onclick = start;
                
                function start(){

                    // clear board at beginning
                    document.querySelectorAll('.square')
                    .forEach(sq => {
                       sq.innerHTML = ""; 
                    });
                    var turn = 1;

                    // decide who goes first at random
                    if (Math.ceil(Math.random()*10) <=5)
                        var marker = "X";
                    else
                        var marker = "O";

                    // update status for who goes first
                    var status = marker+"'s Turn";
                    document.querySelector('.status').innerHTML = status;
                    document.querySelectorAll('.square')
                    .forEach(sq => {
                       sq.onclick = mark; 
                    });
                    
                    // create mark X or O and update status/turn
                    function mark(){
                        if (marker == "X" && this.innerHTML ==""){
                            this.innerHTML=marker;
                            marker = "O";
                        }
                        else if (marker == "O" && this.innerHTML ==""){
                            this.innerHTML=marker;
                            marker ="X";

                        }
                        status = marker+"'s Turn";
                        document.querySelector('.status').innerHTML = status;
                        
                        turn++;

                        checkWin();
                    } 
                }
                
                // Beginning of game, load empty square if inner html is empty
                function loadSquares(){
                    var moves = [];
                    document.querySelectorAll('.square')
                    .forEach(sq => {
                        if (sq.innerHTML !== "") {
                            moves.push(sq.innerHTML);
                        } else {
                            moves.push("-");
                        }
                    });
                    return moves;
                }

                // check if game is over or not
                function checkWin(){
                    var moves = loadSquares();
                    var winConditions = [
                        moves[0] + moves[1] + moves[2],  // top row
                        moves[3] + moves[4] + moves[5],  // middle row
                        moves[6] + moves[7] + moves[8],  // bottom row
                        moves[0] + moves[3] + moves[6],  // left column
                        moves[1] + moves[4] + moves[7],  // middle column
                        moves[2] + moves[5] + moves[8],  // right column
                        moves[0] + moves[4] + moves[8],  // left diagonal
                        moves[2] + moves[4] + moves[6]   // right diagonal
                    ];
                    
                    // checks for win and turns off clicking if game is over
                    if (winConditions.includes("XXX")) {
                        document.querySelector('.status').innerHTML = "X Wins!";
                        document.querySelectorAll('.square').forEach(sq => { sq.onclick = null; });
                    } else if (winConditions.includes("OOO")) {
                        document.querySelector('.status').innerHTML = "O Wins!";
                        document.querySelectorAll('.square').forEach(sq => { sq.onclick = null; });
                    } else if (!moves.includes("-")) {
                        document.querySelector('.status').innerHTML = "Stalemate!";
                        document.querySelectorAll('.square').forEach(sq => { sq.onclick = null; });
                    }
                }                  
            }
        </script>
    </head>

    <body>
        <h1>Tic Tac Toe Game</h1>
        <p>For more information on the game, please see the <a href="https://en.wikipedia.org/wiki/Tic-tac-toe" target="_blank">Wikipedia entry</a>.</p>
        <div class="status">Click Start Game to Play!</div>

        <div class="board">
            <script>
                
                const NUM_SQUARES = 9;
                for (i=0; i<NUM_SQUARES; i++)
                    {
                    id = "sq"+i;
                    document.write( "<div class='square' id='" + id + "'></div>" );
                    }             
                
            </script>
        </div>

        <button>Start Game</button>
    </body>



</html>
