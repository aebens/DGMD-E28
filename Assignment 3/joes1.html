<!Doctype html>

    <head>
        <title>Joe's Hotdogs</title>
    </head>

    <body>
        <h1>Joe's Hotdogs</h1>
        <script>
            menu1 = [];
            menu1["Hotdogs"] = 4;
            menu1["Fries"] = 3.50;
            menu1["Soda"] = 1.50;
            menu1["Sauerkraut"] = 1;

            document.write("<ul>");
            for (var item in menu1){
                document.write("<li>"+ item +": $" + menu1[item]+"</li>")
            }
            document.write("</ul>");


            var menu = {
                Hotdogs: 4,
                Fries: 3.50,
                Soda: 1.50,
                Sauerkraut: 1
            }

            document.write("<ul>");
            for (var item in menu){
                document.write("<li>"+ item +": $" + menu[item]+"</li>")
            }
            document.write("</ul>");

            function menuItem(name, amount)
            
            {
                this.item = name;
                this.price = amount;
            }

            var menuItems = [
                new menuItem("Hotdogs", 4),
                new menuItem("Fries", 3.50),
                new menuItem("Soda", 1.50),
                new menuItem("Sauerkraut", 1)
            ];

            document.write("<ul>");
            for (var i = 0; i < menuItems.length; i++) {
                document.write("<li>"+ menuItems[i].item + ": $" + menuItems[i].price + "</li>");
            }
            document.write("</ul>");
            
        </script>
    </body>

</html>
