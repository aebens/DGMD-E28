<!DOCTYPE html>

<head>
    <title>Tic Tac Toe</title>

    <style>
        body {
            margin: 50px 50px;
            padding: 1 rem;
        }

        .board {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 5px;
            max-width: 310px;
            margin-bottom: 30px;
        }

        .box {
            width: 100px;
            height: 100px;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .box:hover {
            background-color: #c9afcf;
        }

        .status {
            margin-bottom: 20px;
            font-size: 18px;
        }

    </style>
</head>

<body>
    <h1>Tic Tac Toe Game</h1>
    <p>For more information on the game, please see the <a href="https://en.wikipedia.org/wiki/Tic-tac-toe" target="_blank">Wikipedia entry</a>.</p>
    <div class="status">O's Turn</div>

    <div class="board">
        <div class = "box" id="1"></div>
        <div class = "box" id="2">X</div>
        <div class = "box" id="3">X</div>
        <div class = "box" id="4"></div>
        <div class = "box" id="5"></div>
        <div class = "box" id="6"></div>
        <div class = "box" id="7"></div>
        <div class = "box" id="8"></div>
        <div class = "box" id="9">O</div>
    </div>

    <button>Start Game</button>
</body>

</html>
